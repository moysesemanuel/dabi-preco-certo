# Worker de compartilhamento de orçamentos do DaBi Preço Certo.
# Nenhum deploy nem DNS foi configurado: este arquivo serve para desenvolvimento local (wrangler dev / d1 --local).
name = "dabi-orcamentos"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = false

[vars]
# Origem usada para montar os links curtos devolvidos pela API (quando a publicação for habilitada).
PUBLIC_BASE_URL = "https://orcamento.dabitech.com.br"
# Origens do app autorizadas a chamar a API (CORS). Valores de DESENVOLVIMENTO: troque pela origem real do app antes do deploy.
ALLOWED_ORIGINS = "http://localhost:5174,http://127.0.0.1:5174"
# Autenticação antiga por chave de licença (Bearer). Desligada por padrão; use "on" apenas para migrar clientes antigos.
LEGACY_KEY_AUTH = "off"
# Segredos (NÃO ficam aqui): AUTH_SECRET -> `wrangler secret put AUTH_SECRET`; em desenvolvimento, worker/.dev.vars (veja .dev.vars.example).
# EMAIL_ADAPTER: sem valor = sem envio (login responde 503). "dev" = imprime no terminal, só para desenvolvimento.

[[d1_databases]]
binding = "DB"
database_name = "dabi-orcamentos"
# Placeholder para uso local. Antes de qualquer deploy, crie o banco no Cloudflare e substitua pelo ID real.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------------------------------------------------
# AMBIENTES SEPARADOS (nada abaixo foi criado nem publicado). Cada ambiente tem o próprio banco D1, as próprias variáveis e os
# próprios segredos. As variáveis [vars] NÃO são herdadas: repita todas. Os `database_id` abaixo são marcadores: o deploy falha
# até serem trocados pelos IDs reais (criados com `wrangler d1 create`), o que evita publicar por engano.
# Os endereços são EXEMPLOS: ajuste para os domínios reais ao implantar (DNS não é configurado por este repositório).
# Segredos (por ambiente): `wrangler secret put AUTH_SECRET --env staging|production`.
# ---------------------------------------------------------------------------------------------------------------------
[env.staging]
name = "dabi-orcamentos-staging"
workers_dev = false

[env.staging.vars]
PUBLIC_BASE_URL = "https://orcamento-hml.exemplo.com.br"
ALLOWED_ORIGINS = "https://app-hml.exemplo.com.br"
LEGACY_KEY_AUTH = "off"
# E-mail pelo Resend. Sem o segredo RESEND_API_KEY o login responde 503 (nada finge ser enviado).
# Segredo: `wrangler secret put RESEND_API_KEY --env staging`. EMAIL_FROM precisa ser um remetente de domínio verificado no Resend.
EMAIL_ADAPTER = "resend"
EMAIL_FROM = "DaBi Preço Certo <acesso@mail.dabitech.com.br>"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "dabi-orcamentos-staging"
database_id = "SUBSTITUIR-PELO-ID-DO-D1-DE-HOMOLOGACAO"
migrations_dir = "migrations"

[env.production]
name = "dabi-orcamentos"
workers_dev = false

[env.production.vars]
PUBLIC_BASE_URL = "https://orcamento.exemplo.com.br"
ALLOWED_ORIGINS = "https://app.exemplo.com.br"
LEGACY_KEY_AUTH = "off"
# Segredo: `wrangler secret put RESEND_API_KEY --env production`.
EMAIL_ADAPTER = "resend"
EMAIL_FROM = "DaBi Preço Certo <acesso@mail.dabitech.com.br>"

[[env.production.d1_databases]]
binding = "DB"
database_name = "dabi-orcamentos-producao"
database_id = "SUBSTITUIR-PELO-ID-DO-D1-DE-PRODUCAO"
migrations_dir = "migrations"

# Banco SÓ para ensaiar restauração de backups (`npm run d1 -- restore-file --env restore --file backup.sql`). Nunca recebe dados reais por outro caminho.
[env.restore]
name = "dabi-orcamentos-restauracao"
workers_dev = false

[[env.restore.d1_databases]]
binding = "DB"
database_name = "dabi-orcamentos-restauracao"
database_id = "SUBSTITUIR-PELO-ID-DO-D1-DE-RESTAURACAO"
migrations_dir = "migrations"
